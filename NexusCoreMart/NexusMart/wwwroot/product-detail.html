<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | NexusMart</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/nexusmart.css">
    <link rel="stylesheet" href="css/product-detail.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <nav class="navbar">
        <div class="brand"><a href="index.html" style="text-decoration: none; color: inherit;"><i
                    class="fa-solid fa-store"></i> NexusMart</a></div>
        <div class="nav-actions">
            <button id="theme-toggle" class="icon-btn"><i id="theme-icon" class="fa-solid fa-moon"></i></button>
            <a href="checkout.html" class="icon-btn" id="cart-btn">
                <i class="fa-solid fa-cart-shopping"></i><span class="cart-badge" id="cart-count">0</span>
            </a>
        </div>
    </nav>

    <main class="product-view">
        <div class="product-gallery">
            <img src="" alt="Product Image" id="det-img" class="main-image">
        </div>
        <div class="product-info">
            <h1 id="det-title">Loading Product...</h1>
            <div class="rating-stars">
                <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i
                    class="fa-solid fa-star"></i><i class="fa-regular fa-star"></i>
                <span>(124 reviews)</span>
            </div>
            <div class="price-tag" id="det-price">₹ 0.00</div>
            <p class="desc-text" id="det-desc">Please wait while we fetch the details...</p>

            <ul class="specs-list">
                <li id="det-stock"><i class="fa-solid fa-circle-notch fa-spin"></i> Checking availability...</li>
                <li><i class="fa-solid fa-shield"></i> 1 Year Warranty</li>
                <br>
            </ul>

            <div class="qty-control">
                <button class="qty-btn" id="qty-minus">-</button>
                <span id="qty-display">1</span>
                <button class="qty-btn" id="qty-plus">+</button>
            </div>

            <button class="btn-large" id="add-multi-btn" disabled>
                <i class="fa-solid fa-cart-plus"></i> Add to Cart
            </button>
        </div>
    </main>

    <script src="js/theme-engine.js"></script>
    <script src="js/cart-manager.js"></script>
    <script src="js/product-detail.js"></script>
    <script src="js/auth-state.js"></script>
</body>

</html>
