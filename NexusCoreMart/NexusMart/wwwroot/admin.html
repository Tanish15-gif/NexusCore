<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | NexusMart</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/nexusmart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="dark-mode">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <h2><i class="fa-solid fa-server"></i> MartAdmin</h2>
            <a href="#" class="active"><i class="fa-solid fa-box"></i> Inventory</a>
            <a href="#"><i class="fa-solid fa-truck"></i> Orders</a>
            <div style="margin-top: auto;">
                <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Store</a>
            </div>
        </aside>

        <main class="admin-content">
            <div class="admin-header">
                <h1>Inventory Management</h1>
                <div class="nav-actions">
                    <button id="theme-toggle" class="icon-btn">
                        <i id="theme-icon" class="fa-solid fa-moon"></i>
                    </button>
                    <button class="btn-add" id="open-modal-btn"><i class="fa-solid fa-plus"></i> Add Product</button>
                </div>
            </div>

            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="product-table-body"></tbody>
            </table>
        </main>
    </div>

    <div class="modal" id="add-modal">
        <div class="modal-content">
            <h2><i class="fa-solid fa-box-open"></i> Add New Product</h2>
            <form id="add-product-form">
                <div class="input-grid">
                    <div class="input-group">
                        <label>Product Name</label>
                        <input type="text" id="prod-name" placeholder="e.g., 4K Monitor" required>
                    </div>
                    <div class="input-group">
                        <label>Category</label>
                        <select id="prod-cat" required>
                            <option value="" disabled selected>Select the Category</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Home">Home & Kitchen</option>
                            <option value="Gaming">Gaming</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Price (₹)</label>
                        <input type="number" id="prod-price" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="input-group">
                        <label>Stock Quantity</label>
                        <input type="number" id="prod-stock" placeholder="0" required>
                    </div>
                </div>

                <div class="input-group" style="margin-top: 15px;">
                    <label>Description</label>
                    <textarea id="prod-desc" rows="3" placeholder="Product details..." required></textarea>
                </div>

                <div class="input-group" style="margin-top: 15px;">
                    <label>Add Product Image</label>

                    <label for="prod-img" class="clean-file-upload">
                        <i class="fa-solid fa-cloud-arrow-up"></i>

                        <span id="add-file-name-display">Select an image...</span>
                    </label>

                    <input type="file" id="prod-img" accept="image/*" style="display: none;" required>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="close-modal-btn">Cancel</button>
                    <button type="submit" class="btn-add" id="submit-btn">Save to DB</button>
                </div>
                <div id="admin-message" class="message-box"></div>
            </form>
        </div>
    </div>
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <h2><i class="fa-solid fa-pen-to-square"></i> Edit Product</h2>
            <form id="edit-product-form">
                <input type="hidden" id="edit-prod-id">

                <div class="input-grid">
                    <div class="input-group">
                        <label>Product Name</label>
                        <input type="text" id="edit-prod-name" required>
                    </div>
                    <div class="input-group">
                        <label>Category</label>
                        <select id="edit-prod-cat" required>
                            <option value="Electronics">Electronics</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Home">Home & Kitchen</option>
                            <option value="Gaming">Gaming</option>
                            <option value="Groceries">Groceries</option>
                            <option value="Software">Software</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Price (₹)</label>
                        <input type="number" id="edit-prod-price" step="0.01" required>
                    </div>
                    <div class="input-group">
                        <label>Stock Quantity</label>
                        <input type="number" id="edit-prod-stock" required>
                    </div>
                    <div class="input-group" style="margin-top: 15px;">
                        <label>Description</label>
                        <textarea id="edit-prod-desc" rows="3" required></textarea>
                    </div>

                    <div class="input-group" style="margin-top: 15px;">
                        <label>Update Product Image</label>

                        <label for="edit-prod-img" class="clean-file-upload">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <span id="edit-file-name-display">Select a new image...</span>
                        </label>

                        <input type="file" id="edit-prod-img" accept="image/*" style="display: none;">
                    </div>
                </div>

                <div class="modal-actions" style="display: flex; justify-content: space-between; margin-top: 25px;">
                    <button type="button" class="btn-cancel" id="delete-product-btn"
                        style="color: #ff4d4d; border-color: #ff4d4d;">
                        <i class="fa-solid fa-trash"></i> Delete
                    </button>

                    <div style="display: flex; gap: 10px;">
                        <button type="button" class="btn-cancel" id="close-edit-modal-btn">Cancel</button>
                        <button type="submit" class="btn-add" id="save-edit-btn">Save Changes</button>
                    </div>
                </div>
                <div id="edit-admin-message" class="message-box"></div>
            </form>
        </div>
    </div>

    <script src="js/admin.js"></script>
    <script src="js/theme-engine.js"></script>
    <script src="js/auth-state.js"></script>
</body>

</html>
