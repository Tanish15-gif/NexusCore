<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Account Details | NexusCore Bank</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.png">
    <link rel="stylesheet" href="css/features.css">
</head>

<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-layer-group"></i> NexusCore
            </a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="features.html">Features</a></li>
                <li><a href="Accounts.html" class="active">Accounts</a></li>
            </ul>

            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Dark Mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <a href="login.html" class="btn btn-outline">Login</a>
                <a href="register.html" class="btn btn-primary">Create Account</a>
            </div>

            <div class="menu-toggle">
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>
    </nav>

    <div class="container" style="padding: 100px 20px; text-align: center;">
        <h1 id="account-title">Loading...</h1>
        <p id="account-description" style="max-width: 600px; margin: 20px auto; line-height: 1.6;">
            Loading description...
        </p>
        <a href="Accounts.html" class="btn btn-outline">Back to Accounts</a>
        <a href="register.html" class="btn btn-primary">Apply Now</a>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const accountType = urlParams.get('type');

        const accountData = {
            'savings': {
                title: 'Savings Account',
                description: 'The Everyday Tier. Build your wealth securely with a 4% annual interest rate, calculated daily and paid monthly. Enjoy zero maintenance fees when you maintain a minimum balance, plus exclusive NexusMart cashback rewards.'
            },
            'current': {
                title: 'Current Account',
                description: 'The Business Tier. Manage high-volume transactions with zero fees. Designed for creators and entrepreneurs, featuring a massive ₹50,000 overdraft limit to keep your cash flow moving.'
            },
            'fd': {
                title: 'Fixed-Deposit Account',
                description: 'Fixed deposit (FD) accounts are a safe investment instrument where you deposit a lump sum for a fixed period at a predetermined interest rate. They are generally considered low-risk because returns are not subject to market fluctuations.'
            },
            'Rd' : {
                title: 'Recurring-Deposit Account',
                description: 'A Recurring Deposit (RD) is a specific type of term deposit that allows you to build a savings corpus through fixed monthly instalments rather than a single lump-sum payment. It is particularly popular in India for individuals with regular monthly income who want to earn interest rates similar to those of Fixed Deposits (FDs)'
            },
            'loan': {
                title: 'Loan Account',
                description: 'A loan is a formal financial agreement where a lender (such as a bank, NBFC, or individual) provides a sum of money to a borrower, who agrees to repay it over a specific period, usually with added interest.'
            },
            'daily': {
                title: 'Daily-Deposit Account',
                description: 'A Daily Deposit Account (often called a "Daily Deposit Scheme" or "Pigmy Deposit") is a unique savings product in India designed primarily for small business owners, daily wage earners, and traders. It allows individuals to save small amounts of money on a daily basis, which are typically collected from their doorstep by an authorized bank agent.'
            }
        };

        // 3. Inject the data into the HTML
        if (accountData[accountType]) {
            document.getElementById('account-title').innerText = accountData[accountType].title;
            document.getElementById('account-description').innerText = accountData[accountType].description;
        } else {
            document.getElementById('account-title').innerText = "Account Not Found";
            document.getElementById('account-description').innerText = "Please select a valid account tier.";
        }
    </script>
    <script src="js/script.js"></script>
</body>

</html>
