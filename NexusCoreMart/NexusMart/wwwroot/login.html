<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusMart | Authentication</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="auth-split-wrapper">
        <button id="theme-toggle" class="theme-btn-absolute">
            <i id="theme-icon" class="fa-solid fa-moon"></i>
        </button>

        <div class="auth-banner">
            <div class="banner-content">
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <h1><i class="fa-solid fa-store"></i> NexusMart</h1>
                </a>
                
                <p>The enterprise marketplace powered by NexusCore.</p>
            </div>
        </div>

        <div class="auth-form-side">
            <div class="auth-form-container">
                <div class="auth-header">
                    <h2 id="auth-title">Welcome Back</h2>
                    <p id="auth-subtitle">Enter your details to access your account.</p>
                </div>

                <form id="login-form">
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="login-email" placeholder="name@example.com" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-solid-primary">Sign In</button>
                    <div id="Login-message" class="message-box"></div>
                    <div class="auth-footer">
                        <p>New to NexusMart? <a href="#" id="show-register">Create an account</a></p>
                    </div>
                </form>

                <form id="register-form" class="hidden">
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="reg-name" placeholder="John Doe" required>
                    </div>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="reg-email" placeholder="name@example.com" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="reg-password" placeholder="Create a strong password" required>
                    </div>
                    <button type="submit" class="btn-solid-primary">Create Identity</button>
                    <div id="SignUp-message" class="message-box"></div>
                    <div class="auth-footer">
                        <p>Already have an account? <a href="#" id="show-login">Sign in here</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/theme-engine.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/auth-state.js"></script>
</body>
</html>
