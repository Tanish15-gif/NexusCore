<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | NexusMart</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/nexusmart.css">
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <nav class="navbar">
        <div class="brand"><a href="index.html" style="text-decoration: none; color: inherit;"><i
                    class="fa-solid fa-store"></i> NexusMart Checkout</a></div>
        <div class="nav-actions">
            <button id="theme-toggle" class="icon-btn"><i id="theme-icon" class="fa-solid fa-moon"></i></button>
        </div>
    </nav>

    <div class="checkout-layout">
        <div class="cart-items-section">
            <h2>Your Cart</h2>
            <div id="checkout-cart-container">
            </div>
        </div>

        <div class="order-summary-section">
            <h2>Order Summary</h2>
            <div class="summary-details">
                <div class="summary-row"><span>Subtotal</span><span id="subtotal">₹ 0</span></div>
                <div class="summary-row"><span>Taxes (18% GST)</span><span id="taxes">₹ 0</span></div>
                <div class="summary-row"><span>Shipping</span><span class="free-text">FREE</span></div>
                <div class="total-row"><span>Total</span><span id="grand-total">₹ 0</span></div>
            </div>

            <div class="payment-section-container">
                <div class="security-badge">
                    <p><i class="fa-solid fa-building-columns"></i> Link detected. Payment will be securely routed
                        through
                        your <strong>NexusCore Bank</strong> account.</p>
                </div>

                <div class="payment-selector" style="margin-bottom: 1.5rem;">
                    <label for="payment-bank"
                        style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem;">Select
                        Payment Method</label>
                    <select id="payment-bank"
                        style="width: 100%; padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); font-size: 1rem;">
                        <option value="">Loading your accounts...</option>
                    </select>
                </div>

                <button class="btn-pay" id="btn-process-payment"><i class="fa-solid fa-lock"></i> Pay via
                    NexusCore</button>
            </div>
        </div>
    </div>

    <script src="js/theme-engine.js"></script>
    <script src="js/cart-manager.js"></script>
    <script src="js/checkout.js"></script>
    <script src="js/auth-state.js"></script>
</body>

</html>
