<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | NexusMart</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/nexusmart.css">
    <link rel="stylesheet" href="css/categories.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="brand"><a href="index.html" style="text-decoration: none; color: inherit;"><i class="fa-solid fa-store"></i> NexusMart</a></div>
        <div class="search-bar">
            <input type="text" placeholder="Search products...">
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="nav-actions">
            <button id="theme-toggle" class="icon-btn"><i id="theme-icon" class="fa-solid fa-moon"></i></button>
            <a href="checkout.html" class="icon-btn" id="cart-btn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge" id="cart-count">0</span>
            </a>
        </div>
    </nav>

    <div class="layout-container">
        <aside class="filter-sidebar">
            <div class="filter-group">
                <h4>Categories</h4>
                <label><input type="radio" name="cat" value="all" checked> All</label>
                <label><input type="radio" name="cat" value="electronics"> Electronics</label>
                <label><input type="radio" name="cat" value="gaming"> Gaming</label>
                <label><input type="radio" name="cat" value="groceries"> Groceries</label>
            </div>
            <div class="filter-group">
                <h4>Price Range</h4>
                <label><input type="checkbox" value="1000"> Under ₹1,000</label>
                <label><input type="checkbox" value="5000"> ₹1,000 - ₹5,000</label>
                <label><input type="checkbox" value="5001"> Over ₹5,000</label>
            </div>
        </aside>

        <main class="results-main">
            <div class="results-header">
                <h3 id="results-title">Showing all products</h3>
                <select class="sort-select" id="sort-filter">
                    <option>Price: Low to High</option>
                    <option>Price: High to Low</option>
                    <option>Newest Arrivals</option>
                </select>
            </div>
            
            <div class="product-grid" style="padding: 0;">
                <div class="product-card">
                    <img src="https://via.placeholder.com/200" alt="Product" class="product-image">
                    <h3>4K Gaming Monitor</h3>
                    <h2 class="price-text">₹ 25,999</h2>
                    <button class="add-to-cart-btn" onclick="addToCart(1, '4K Gaming Monitor', 25999)"><i class="fa-solid fa-plus"></i> Add to Cart</button>
                </div>
            </div>
        </main>
    </div>

    <script src="js/theme-engine.js"></script>
    <script src="js/cart-manager.js"></script>
    <script src="js/categories.js"></script>
    <script src="js/auth-state.js"></script>
</body>
</html>
