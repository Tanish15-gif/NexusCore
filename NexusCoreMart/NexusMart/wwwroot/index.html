<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusMart | Enterprise E-Commerce</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/nexusmart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <nav class="navbar">
        <div class="brand">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <i class="fa-solid fa-store"></i> NexusMart
            </a>
        </div>

        <div class="search-bar">
            <input type="text" placeholder="Search groceries, electronics, gaming...">
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="nav-actions">
            <button id="theme-toggle" class="icon-btn">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>

            <a href="login.html" class="icon-btn" id="nav-login-link" title="Sign In">
                <i class="fa-regular fa-user"></i>
            </a>

            <a href="profile.html" class="icon-btn" id="nav-dashboard-link" title="My Dashboard" style="display: none;">
                <i class="fa-solid fa-user-shield" style="color: var(--primary-accent);"></i>
            </a>

            <button class="icon-btn" id="nav-logout-btn" title="Log Out"
                style="display: none; border: none; background: transparent; cursor: pointer;">
                <i class="fa-solid fa-arrow-right-from-bracket" style="color: #ff4757;"></i>
            </button>

            <a href="checkout.html" class="icon-btn" id="cart-btn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge" id="cart-count">0</span>
            </a>
        </div>
    </nav>

    <header class="hero-section">
        <div class="hero-content">
            <h1>Next-Gen Gaming Sale</h1>
            <p>Exclusive discounts for NexusCore Cardholders. Upgrade your setup today.</p>
            <button class="btn-hero">Shop Now</button>
        </div>
    </header>

    <!-- Remove border-bottom from category-nav, add to sort-controls only -->
    <div class="category-nav">
        <button class="category-pill active">All</button>
        <button class="category-pill" data-category="Groceries">🍎 Groceries</button>
        <button class="category-pill" data-category="Electronics">💻 Electronics</button>
        <button class="category-pill" data-category="Gaming">🎮 Gaming</button>
        <button class="category-pill" data-category="Software">🛋️ Software</button>
    </div>

    <!-- ONE clean sort-controls with bottom border only -->
    <div class="controls-row">
        <div class="sort-controls">
            <label for="sort-select">Sort by:</label>
            <select id="sort-select">
                <option value="name-asc">Name (A-Z)</option>
                <option value="name-desc">Name (Z-A)</option>
                <option value="price-asc" selected>Price (Low to High)</option>
                <option value="price-desc">Price (High to Low)</option>
                <option value="rating-desc">Rating (Highest)</option>
                <option value="newest">Newest First</option>
            </select>
        </div>
    </div>

    <main class="product-grid" id="customer-product-grid">
        <div style="grid-column: 1 / -1; text-align: center; padding: 50px; color: var(--text-muted);">
            <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color: var(--primary-accent);"></i>
            <p style="margin-top: 15px; font-weight: 500;">Loading latest inventory...</p>
        </div>
    </main>

    <script src="js/theme-engine.js"></script>
    <script src="js/storefront.js"></script>
    <script src="js/cart-manager.js"></script>
    <script src="js/auth-state.js"></script>
</body>

</html>
